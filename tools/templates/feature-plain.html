    <article class="feature feature--plain">
      <div class="feature__body">
        <div class="kicker">{{KICKER}}</div>
        <h2 class="feature__title"><a href="/posts/{{SLUG}}.html">{{TITLE}}</a></h2>
        <p class="feature__excerpt">{{SUMMARY}}</p>
        <div class="meta">
          <span>{{DATE_TEXT}}</span><span class="sep">/</span>
          <span>{{READTIME}}</span><span class="sep">/</span>
          <span>{{WORDS}} 字</span>
        </div>
      </div>
    </article>

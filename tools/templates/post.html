<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{NAME}} {{LATIN}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{SITE_URL}}/posts/{{SLUG}}.html">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}} — {{NAME}} {{LATIN}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{SITE_URL}}/posts/{{SLUG}}.html">
<meta name="theme-color" content="#070808">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{NAME}} {{LATIN}} RSS" href="/feed.xml">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
/* 定主题 + 标记 JS 可用（避免无 JS 时内容被进场动画藏起来） */
(function () {
  var t = null;
  try { t = localStorage.getItem('margin-theme'); } catch (e) {}
  if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'night';
  document.documentElement.setAttribute('data-theme', t || 'night');
  document.documentElement.classList.add('js');
})();
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div class="scanlines" aria-hidden="true"></div>
<div class="progress"><div class="progress__bar"></div></div>

<!-- build:nav -->
<!-- /build:nav -->

<main id="main">
  <article>
    <header class="wrap article-head">
      <div class="kicker">{{KICKER}}</div>
      <h1>{{TITLE}}</h1>
      <p class="standfirst">{{STANDFIRST}}</p>
      <div class="byline">
        <span><time datetime="{{DATE}}">{{DATE_TEXT}}</time></span>
        <span class="dot"></span><span data-readtime>{{READTIME}}</span>
        <span class="dot"></span><span>{{WORDS}} 字</span>
        <span class="dot"></span><span>{{STACK}}</span>
      </div>
      <div class="ptags">{{TAGS}}</div>
    </header>

{{BODY}}

    <nav class="wrap pager" aria-label="文章导航">
{{PAGER}}
    </nav>

    <section class="wrap related"{{HAS_RELATED}}>
      <h2 class="blockhead">顺着读下去<span class="blockhead__line"></span></h2>
      <div class="related__list">
{{RELATED}}
      </div>
    </section>

    <section class="wrap comments" data-comments data-slug="{{SLUG}}" data-api="{{COMMENTS_API}}">
      <h2 class="blockhead">留言<span class="blockhead__note" data-comments-count></span></h2>

      <form class="cform" data-comments-form hidden>
        <div class="cform__top">
          <input class="cform__nick" type="text" name="nick" maxlength="24" autocomplete="off"
                 placeholder="昵称（可留空）">
          <span class="cform__replying" data-reply-hint hidden>
            正在回复 <b data-reply-to></b>
            <button type="button" class="cform__cancel" data-reply-cancel>取消</button>
          </span>
        </div>
        <textarea class="cform__body" name="body" rows="3" maxlength="2000" required
                  placeholder="说点什么…空行分段，**粗体** 和 `代码` 也认"></textarea>
        <div class="cform__bottom">
          <span class="cform__meta">完全匿名 · 不需要登录 · 昵称可留空</span>
          <button class="btn btn--solid" type="submit" data-comments-submit>发表</button>
        </div>
        <input class="cform__trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="elapsed" value="0">
      </form>

      <p class="comments__state" data-comments-state>正在载入留言…</p>
      <ol class="clist" data-comments-list></ol>
    </section>
  </article>
</main>

<!-- build:footer -->
<!-- /build:footer -->

<script src="/assets/js/site.js"></script>
<script src="/assets/js/comments.js" defer></script>
</body>
</html>

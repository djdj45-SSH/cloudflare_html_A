      <div class="stats" data-reveal>
        <div class="stat">
          <span class="stat__k">已发表</span>
          <div class="stat__v"><span data-count="{{COUNT}}">{{COUNT}}</span><em> 篇</em></div>
          <div class="stat__s">全部含实测数据</div>
        </div>
        <div class="stat">
          <span class="stat__k">最近更新</span>
          <div class="stat__v">{{LATEST_MD}}</div>
          <div class="stat__s">{{LATEST_TITLE}}</div>
        </div>
        <div class="stat">
          <span class="stat__k">路端电压</span>
          <div class="stat__v" data-scope-live="amp">3.28 V</div>
          <div class="stat__s">3V3 轨 · 稳态</div>
        </div>
        <div class="stat">
          <span class="stat__k">平均阅读</span>
          <div class="stat__v"><span data-count="{{AVG_MIN}}">{{AVG_MIN}}</span><em> 分钟</em></div>
          <div class="stat__s">不写摘要式长文</div>
        </div>
      </div>

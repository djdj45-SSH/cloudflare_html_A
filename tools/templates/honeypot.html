<!DOCTYPE html>
<!--
  余量 MARGIN — 蜜罐页模板
  ------------------------------------------------------------------
  由 tools/build-traps.mjs 渲染成 traps/honeypot.html。
  占位符（下面正文里出现的双写花括号名）：CLIENT / COUNT / GENERATED / ENTRIES

  ⚠️ 本文件的注释里不要写出带花括号的占位符名 —— replaceAll 会一并替换，
     把内容灌进注释。生成器会检查"模板是否含占位符"和"渲染后是否还有残留"。

  这一页不"拒绝"爬虫，而是骗它：结构完全正确、字段整齐、日期合理，
  但每一条数据都是假的（由 build-traps.mjs 以固定种子生成，保证幂等）。

  教学价值：这是全项目唯一"爬到了、但数据是错的"场景。
  它逼着抓取方去写校验 —— 时间范围、正文长度分布、重复率、**链接可达性**。
  破绽是故意留的：所有 /posts/no-*.html 链接都是死的。

  样式在 assets/css/trap.css。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>归档 — 余量 MARGIN</title>
<style>body{background:#070808;color:#e6ece8;margin:0;padding:40px 24px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.8}a{color:#5EE39B}</style>
<link rel="stylesheet" href="/assets/css/trap.css">
</head>
<body class="is-honeypot">
<div class="wrap">

  <header>
    <div class="brand">余量 <b>MARGIN</b></div>
    <h1>归档</h1>
    <div class="meta">共 {{COUNT}} 篇文章 · 生成于 {{GENERATED}}</div>
  </header>

  <ul>
{{ENTRIES}}
  </ul>

  <footer>
    共 {{COUNT}} 篇。抓取许可与联系方式见 <a href="/robots.txt">/robots.txt</a>。<br>
    本次请求的客户端身份已被记录：{{CLIENT}}
  </footer>

</div>
</body>
</html>

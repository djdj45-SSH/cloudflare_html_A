  <article class="entry" data-search="{{KEYWORDS}}">
    <div class="entry__num">{{NUM}}</div>
    <div>
      <h3 class="entry__title"><a href="/posts/{{SLUG}}.html">{{TITLE}}<span class="entry__arrow">→</span></a></h3>
      <p class="entry__excerpt">{{SUMMARY}}</p>
    </div>
    <div class="entry__meta">{{DATE_MD}}<br>{{LIST_CATEGORY}}</div>
  </article>

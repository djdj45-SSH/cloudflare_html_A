# 余量 MARGIN — 留言板 Worker
# 部署：cd worker && wrangler deploy

name = "margin-comments"
main = "index.js"
compatibility_date = "2025-09-01"

# ⚠️ 必须显式写 true。一旦文件里出现 routes，wrangler 会默认把 workers.dev 入口**关掉**
#    （"Because 'workers_dev' is not in your Wrangler file, it will be disabled"）。
#    踩过：加 routes 的同时没写这行 → 路由没建成 + workers.dev 被关 = 两个入口都没了。
workers_dev = true

# 【备选方案，当前未启用】把 API 也挂到站点自有域名下：blog.djdj45.top/api/*
# 需要 token 具备 zone 作用域的 `Workers Routes: Edit`，当前 token 没有，故暂时注释。
# 真正落地的是 Pages Functions（见仓库根目录 functions/api/[[path]].js），
# 那条路同源、不需要任何额外权限、且随站点一起部署。
#
# routes = [
#   { pattern = "blog.djdj45.top/api*", zone_name = "djdj45.top" }
# ]

[[d1_databases]]
binding = "DB"                                  # 代码里用 env.DB 访问
database_name = "margin_comments"
database_id = "3c7e1ad3-9df5-4c26-8b8c-2af9919166b8"

[vars]
# 允许哪些来源跨域调用。上线后建议改成你自己的域名，缩小暴露面。
ALLOWED_ORIGIN = "https://blog.djdj45.top"

# OWNER_KEY 不要写在这里——用 secret 保存：
#   wrangler secret put OWNER_KEY
